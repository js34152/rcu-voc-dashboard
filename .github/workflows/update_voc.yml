name: Update VOC Data Automatically

on:
  schedule:
    # 매일 한국 시간 기준 오전 6시 (UTC 21:00)에 자동 실행
    - cron: '0 21 * * *'
  # GitHub 웹 Actions 탭에서 원클릭 수동 실행 지원
  workflow_dispatch:

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 수집 및 정제 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas duckduckgo_search google-play-scraper youtube-comment-downloader feedparser python-pptx

      - name: 최신 글로벌 VoC 데이터 수집 (collector2.py)
        run: |
          python collector2.py

      - name: 회사 홍보글 및 광고 노이즈 필터링 (clean_db.py)
        run: |
          python clean_db.py

      - name: 갱신된 voc_db.csv 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add voc_db.csv
          if git diff --staged --quiet; then
            echo "새로 수집된 신규 데이터가 없어 커밋을 건너뜁니다."
          else
            git commit -m "Auto: 최신 VoC 데이터 자동 수집 및 정제 동기화 [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
